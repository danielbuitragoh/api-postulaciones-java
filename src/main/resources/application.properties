spring.application.name=api-postulaciones-java

# Render indica el puerto por la variable PORT.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postulaciones}
spring.datasource.username=${DB_USER:postulaciones}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo manda Flyway; Hibernate solo comprueba que las entidades encajan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sin valor por defecto a propósito: la API no arranca sin un secreto propio.
app.jwt.secret=${JWT_SECRET}

# Swagger UI en /docs. persist-authorization recuerda el token al recargar la página.
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.persist-authorization=true

# Peticiones por minuto y por IP. El login es mucho más estricto que el resto.
app.rate-limit.login-por-minuto=5
app.rate-limit.registro-por-minuto=5
app.rate-limit.general-por-minuto=100

# Cuántos hashes Argon2id (19 MiB cada uno) pueden calcularse a la vez y cuánto espera una petición
# a que quede hueco antes de recibir 503. Medido en la imagen Docker con 512 MB: 8 simultáneos
# pasaban y 12 mataban el contenedor.
app.hash.concurrentes=3
app.hash.espera-ms=3000

# server.forward-headers-strategy NO se activa aquí a propósito. Con "native" Tomcat se cree la
# cabecera X-Forwarded-For cuando la conexión llega de una IP interna (127.0.0.1 o la red de
# Docker lo son), y un cliente podría inventarse una IP distinta en cada petición para repartirlas
# entre cubos del límite. Solo se activa donde hay un proxy de confianza delante: en Render, con la
# variable SERVER_FORWARD_HEADERS_STRATEGY=native (ver render.yaml), para que la API sepa que la
# petición original era HTTPS (enlaces de Swagger, HSTS).

# Cabecera con la IP real del cliente para el límite de peticiones. Vacía = IP de la conexión
# (lo correcto en local y en docker compose). En Render: APP_RATE_LIMIT_CABECERA_IP_REAL.
app.rate-limit.cabecera-ip-real=

# Actuator expone solo la salud, y bajo /salud en lugar de /actuator/health.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoints.web.path-mapping.health=salud
management.endpoint.health.show-details=never
