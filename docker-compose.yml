services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-postulaciones}
      POSTGRES_USER: ${DB_USER:-postulaciones}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env antes de arrancar}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postulaciones} -d ${DB_NAME:-postulaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-postulaciones}
      DB_USER: ${DB_USER:-postulaciones}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Rellena JWT_SECRET en .env (mira .env.example)}
    ports:
      - "8080:8080"

volumes:
  datos-postgres:
