name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Las pruebas usan Testcontainers con PostgreSQL 16: el runner de Ubuntu ya trae Docker.
      # No hace falta ningún secreto: las pruebas generan su propio JWT_SECRET aleatorio.
      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B verify

      # Render despliega construyendo el Dockerfile, no el jar de arriba: se comprueba que esa
      # imagen también se construye (en Linux, con los permisos de git, como en Render).
      - name: Construir la imagen Docker
        run: docker build -t api-postulaciones-java .
